<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Oliver — Book a Demo</title>
<style>
  :root {
    --bg-dark: #0b0f17;
    --card-bg: #ffffff;
    --accent: #1a2b4a;
    --accent-light: #2f4a78;
    --text-muted: #8a94a0;
    --border: #d8dde3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-dark);
    background-image: radial-gradient(circle at 20% 20%, rgba(47,74,120,0.25), transparent 40%),
                       radial-gradient(circle at 80% 0%, rgba(47,74,120,0.15), transparent 35%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
  }
  .page { width: 100%; max-width: 620px; }
  .url-pill {
    display: inline-block;
    background: rgba(255,255,255,0.06);
    color: #97a3b0;
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 20px;
    font-family: 'SFMono-Regular', Consolas, monospace;
    margin-bottom: 22px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .url-row { text-align: center; }
  h1 {
    color: #fff;
    font-size: 34px;
    font-weight: 800;
    margin: 0 0 10px;
    text-align: center;
    letter-spacing: -0.02em;
  }
  .sub {
    color: #9aa5b1;
    font-size: 16.5px;
    margin: 0 0 26px;
    text-align: center;
  }
  .card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 34px;
    box-shadow: 0 25px 70px rgba(0,0,0,0.45);
  }
  label {
    display: block;
    font-weight: 700;
    font-size: 13.5px;
    color: #1a1a1a;
    margin-bottom: 6px;
  }
  .optional-tag {
    font-weight: 400;
    color: var(--text-muted);
  }
  input, select {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    color: #2a2a2a;
    background: #fff;
    font-family: inherit;
  }
  input::placeholder { color: #aab2bb; }
  .field { margin-bottom: 18px; }
  .row { display: flex; gap: 16px; }
  .row .field { flex: 1; }
  .trust-line {
    text-align: center;
    color: #8a94a0;
    font-size: 13px;
    margin: 6px 0 20px;
  }
  button.cta {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  button.cta:hover { background: var(--accent-light); }
  .mandatory-note {
    text-align: center;
    color: #b0b6bd;
    font-size: 12px;
    margin-top: 14px;
  }
  .compare-note {
    margin-top: 28px;
    text-align: center;
    color: #6b7684;
    font-size: 13px;
    line-height: 1.6;
  }
  .compare-note b { color: #9aa5b1; }
</style>
</head>
<body>
  <div class="page">
    <div class="url-row"><span class="url-pill">oliver.app/contactus</span></div>
    <h1>Let's Work Together</h1>
    <p class="sub">The best results come from collaboration.</p>

    <div class="card">
      <div class="field">
        <label>Work Email*</label>
        <input placeholder="e.g. name@company.com" />
      </div>

      <div class="row">
        <div class="field">
          <label>Full Name*</label>
          <input placeholder="Jane Smith" />
        </div>
        <div class="field">
          <label>Company*</label>
          <input placeholder="Acme Benefits Inc." />
        </div>
      </div>

      <div class="field">
        <label>What are you looking to solve? <span class="optional-tag">(optional)</span></label>
        <select>
          <option>Select what fits best...</option>
          <option>Replacing an outdated legacy system</option>
          <option>Managing multiple plans or employers</option>
          <option>Simplifying group billing</option>
          <option>Complex hourly / eligibility rules</option>
          <option>Pension plan administration</option>
          <option>Something else</option>
        </select>
      </div>

      <div class="field" style="margin-bottom: 8px;">
        <label>Phone <span class="optional-tag">(optional)</span></label>
        <input placeholder="e.g. +1 555-555-5555" />
      </div>

      <div class="trust-line">
        Request a 20-minute call or demo
      </div>

      <button class="cta">Book a Call</button>
      <div class="mandatory-note">Mandatory*</div>
    </div>
  </div>
</body>
</html>
